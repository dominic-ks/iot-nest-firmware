# Copy this file to ~/.config/zigbee2mqtt/zigbee2mqtt-data/configuration.yaml
# before starting the zigbee2mqtt service from docker-compose.

mqtt:
  base_topic: zigbee2mqtt
  server: mqtt://mqtt:1883
  # Optional when your broker requires authentication.
  # user: mqtt_user
  # password: mqtt_password

serial:
  # Preferred for USB coordinators when available.
  # port: /dev/serial/by-id/usb-Adapter_Serial_ID
  port: /dev/ttyACM0
  # Set this if auto-detection fails or you already know the stack.
  # adapter: zstack
  # Optional for some adapters only.
  # baudrate: 115200
  # rtscts: false

advanced:
  # Pick a ZLL-safe channel. If your closest Wi-Fi channel is 1/6/11, start with 15/20/25.
  channel: 11
  network_key: GENERATE
  pan_id: GENERATE
  ext_pan_id: GENERATE
  log_level: info

frontend:
  enabled: true
  port: 8080

homeassistant:
  enabled: false